<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR Codes — Simi Khalid</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    .qr-page { padding-top: 1rem; padding-bottom: 4rem; }
    .qr-intro { max-width: 52ch; color: var(--ink-soft); font-size: 1.2rem; }
    .qr-controls { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: end; margin: 2rem 0 3rem; }
    .qr-controls label { display: grid; gap: 0.4rem; flex: 1 1 320px; font: 500 0.68rem var(--sans); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); }
    .qr-controls input { min-height: 46px; padding: 0 0.9rem; border: 1px solid var(--rule); background: #fffaf2; font: 1rem var(--sans); color: var(--ink); }
    .qr-main { display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; padding: 2rem; margin-bottom: 3rem; background: #fffaf2; box-shadow: var(--shadow-canvas); }
    .qr-main .qr { width: 200px; }
    .qr-main h2 { margin: 0 0 0.4rem; font-weight: 400; font-style: italic; font-size: 2rem; }
    .qr-main p { margin: 0 0 1rem; color: var(--ink-soft); word-break: break-all; }
    .qr { aspect-ratio: 1; }
    .qr svg { display: block; width: 100%; height: 100%; }
    .labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .label { display: grid; grid-template-columns: 96px 1fr; gap: 1rem; align-items: center; padding: 1rem; background: #fffaf2; border: 1px solid var(--rule); break-inside: avoid; }
    .label-title { margin: 0; font-style: italic; font-size: 1.3rem; line-height: 1.15; }
    .label-meta { margin: 0.3rem 0 0.6rem; font: 500 0.6rem var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); }
    .label-cta { margin: 0; font-size: 0.9rem; color: var(--ink-soft); }
    @media print {
      body::before, .site-header, .qr-intro, .qr-controls, .qr-main .btn, .no-print { display: none !important; }
      body { background: #fff; }
      .qr-main, .label { box-shadow: none; background: #fff; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./">Simi Khalid</a>
    <nav class="site-nav"><a href="./">Back to site</a></nav>
  </header>
  <main class="qr-page">
    <p class="eyebrow">QR codes</p>
    <h1 class="section-title">Print &amp; share</h1>
    <p class="qr-intro">One code for business cards, and a small label for each painting so people at an exhibition can scan straight to it. Use your browser's Print to print the labels.</p>

    <div class="qr-controls">
      <label>Site address
        <input id="base" type="url" spellcheck="false">
      </label>
      <button class="btn btn-primary" type="button" onclick="print()">Print</button>
    </div>

    <section class="qr-main">
      <div class="qr" id="main-qr"></div>
      <div>
        <h2>The whole site</h2>
        <p id="main-url"></p>
        <button class="btn btn-ghost" type="button" id="download">Download SVG</button>
      </div>
    </section>

    <h2 class="section-title no-print" style="font-size: 1.8rem; margin-bottom: 1.2rem">Painting labels</h2>
    <div class="labels" id="labels"></div>
  </main>

  <script type="module">
    import {loadContent} from "./js/content.js";

    const baseInput = document.getElementById("base");
    const here = new URL(".", location.href).href;
    baseInput.value = here;

    function qrSvg(text) {
      const qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      return qr.createSvgTag({cellSize: 4, margin: 0, scalable: true});
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
    }

    const {artworks} = await loadContent();

    function render() {
      let base = baseInput.value.trim() || here;
      if (!base.endsWith("/")) base += "/";
      document.getElementById("main-qr").innerHTML = qrSvg(base);
      document.getElementById("main-url").textContent = base;
      document.getElementById("labels").innerHTML = artworks.map((a) => `
        <div class="label">
          <div class="qr">${qrSvg(`${base}#/art/${a.slug}`)}</div>
          <div>
            <p class="label-title">${esc(a.title)}</p>
            <p class="label-meta">${esc([a.category, a.hasSize ? `${a.widthCm} × ${a.heightCm} cm` : ""].filter(Boolean).join(" · "))}</p>
            <p class="label-cta">Scan to view &amp; enquire</p>
          </div>
        </div>`).join("");
    }

    document.getElementById("download").addEventListener("click", () => {
      const svg = document.querySelector("#main-qr svg").outerHTML;
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([svg], {type: "image/svg+xml"}));
      link.download = "simi-khalid-qr.svg";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    baseInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
